<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reviews - Bibliotheca</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2D4475">
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js') }) }
</script>
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/header.css">
<link rel="stylesheet" href="src/css/cards.css">
<style>
.container { max-width: 800px; margin: 40px auto; padding: 0 24px; }
.not-logged-in { text-align: center; padding: 60px 24px; color: #999; }
</style>
</head>
<body>
<header class="site-header">
  <h1 class="page-title"><a href="index.html" class="site-logo">Bibliotheca</a></h1>
  <nav class="auth-nav" id="auth-nav"></nav>
</header>
<div class="container" id="profile-root"></div>
<script src="src/auth.js"></script>
<script src="src/nav.js"></script>
<script>
async function init() {
  const auth = getAuth()
  if (!auth) {
    document.getElementById('profile-root').innerHTML = '<div class="not-logged-in"><h2>Please log in</h2><p><a href="login.html">Sign in with Google</a></p></div>'
    return
  }
  document.getElementById('profile-root').innerHTML = '<h2>My Reviews</h2><div id="reviews-list"></div>'
  loadReviews()
}

async function loadReviews() {
  const el = document.getElementById('reviews-list')
  try {
    const reviews = await apiFetch('/reviews/mine')
    if (reviews.length === 0) { el.innerHTML = '<p>You haven\'t written any reviews yet.</p>'; return }
    el.innerHTML = reviews.map(r => '<div class="review">' +
      '<div class="review-header"><span class="review-date">' + new Date(r.createdAt).toLocaleDateString() + '</span></div>' +
      '<h3><a href="template.html?cover=' + r.bookCover + '&title=' + encodeURIComponent(r.bookTitle || '') + '">' + escapeHtml(r.bookTitle || 'Unknown Book') + '</a></h3>' +
      '<div class="review-text">' + escapeHtml(r.text) + '</div>' +
      '<div class="review-actions"><button class="delete-btn" onclick="deleteReview(\'' + r._id + '\')">Delete</button></div>' +
      '</div>').join('')
  } catch { el.innerHTML = '<p>Failed to load reviews.</p>' }
}

async function deleteReview(id) {
  if (!confirm('Delete this review?')) return
  try {
    await apiFetch('/reviews/' + id, { method: 'DELETE' })
    loadReviews()
  } catch (e) { alert(e.message) }
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

init()
</script>
</body>
</html>
